workflows:
  ios-release:
    name: PhilRoss iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      groups:
        # Create this group in Codemagic UI (Teams > your team > Environment variables)
        # and add: APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
        # APP_STORE_CONNECT_PRIVATE_KEY, CERTIFICATE_PRIVATE_KEY (if using manual signing)
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.philross"
        APP_STORE_APP_ID: "6751194230"
        XCODE_WORKSPACE: "ios/philross.xcworkspace"
        XCODE_SCHEME: "philross"
      node: 20.19.0
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true
    integrations:
      app_store_connect: appstore_credentials
    scripts:
      - name: Install npm dependencies
        script: |
          yarn install --frozen-lockfile
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Fetch signing files
        script: |
          echo $CERTIFICATE_PRIVATE_KEY_B64 | base64 --decode > /tmp/certificate_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/certificate_key.pem \
            --create
      - name: Set up signing certificate
        script: |
          keychain initialize
          keychain add-certificates
      - name: Set up code signing (automatic)
        script: |
          xcode-project use-profiles --project ios/philross.xcodeproj --warn-only
      - name: Increment build number
        script: |
          # Apple rejects an upload whose build number has been seen before,
          # with "includes an attribute with a value that has already been
          # used". Getting this number right is the whole job.
          #
          # Two earlier versions both got it wrong:
          #
          #   1. `$(($(get-latest-testflight-build-number) + 1))` — when the
          #      lookup returned nothing, $(( + 1)) evaluated to 1, and build 1
          #      already existed.
          #
          #   2. Preferring get-latest-app-store-build-number and only falling
          #      back to TestFlight. That reads the latest *released* build,
          #      which is behind TestFlight whenever there are unreleased
          #      builds — so it proposed a number TestFlight had already used.
          #
          # Both lookups are asked, and the HIGHER wins. A fallback that is
          # merely "some number" is not good enough; it has to beat everything
          # Apple has ever seen for this app.
          cd ios

          APP_STORE_LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" 2>/dev/null | tr -dc '0-9')
          TESTFLIGHT_LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null | tr -dc '0-9')

          echo "App Store reports: '${APP_STORE_LATEST:-none}'"
          echo "TestFlight reports: '${TESTFLIGHT_LATEST:-none}'"

          LATEST=0
          for candidate in "$APP_STORE_LATEST" "$TESTFLIGHT_LATEST"; do
            if echo "$candidate" | grep -qE '^[0-9]+$' && [ "$candidate" -gt "$LATEST" ]; then
              LATEST="$candidate"
            fi
          done

          if [ "$LATEST" -eq 0 ]; then
            # Neither lookup answered — a network blip, a permissions change, a
            # renamed app. Incrementing from zero would collide with whatever
            # is really up there, so use the clock instead: YYMMDDHHMM always
            # increases and cannot repeat. The next build reads it back through
            # the lookups above and carries on from there.
            NEW=$(date +%y%m%d%H%M)
            echo "Neither lookup answered — falling back to timestamp $NEW"
          else
            NEW=$((LATEST + 1))
            echo "Highest build Apple knows: $LATEST -> using $NEW"
          fi

          agvtool new-version -all "$NEW"
      - name: Build ipa for App Store distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - info@byterisellc.com
        notify:
          success: true
          failure: true

  android-debug:
    # Produces an installable DEBUG APK for on-device UI review.
    #
    # Why this exists: a debug APK loads its JavaScript from a Metro dev server
    # instead of baking it into the binary. Install it once, then every JS/UI
    # change hot-reloads over USB with no rebuild and no local Android SDK.
    # Only native changes (new pods/gradle deps, icons, splash) need a new APK.
    #
    # Deliberately has NO `triggering:` block — it never runs on push. Start it
    # by hand from the Codemagic UI ("Start new build" → this workflow).
    name: PhilRoss Android Debug APK (manual, for device testing)
    max_build_duration: 45
    # macOS, not linux_x2: the Linux instances need a paid Codemagic plan, and
    # a build requesting one fails instantly with "instance type is not
    # available with the current billing plan". The macOS images ship with the
    # Android SDK and build an APK perfectly well.
    instance_type: mac_mini_m2
    environment:
      node: 20.19.0
      java: 17
      vars:
        PACKAGE_NAME: "com.philross"
    scripts:
      - name: Install npm dependencies
        script: |
          yarn install
      - name: Build debug APK
        script: |
          # The repo is authored on Windows, which does not carry the Unix
          # execute bit. gradlew is now stored as 100755 in git, but this guards
          # against it regressing to 100644 on a future Windows commit and
          # failing the build with "./gradlew: Permission denied" (exit 126).
          cd android && chmod +x ./gradlew && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - info@byterisellc.com
        notify:
          success: true
          failure: true

  android-release:
    name: PhilRoss Android Release (mirrors local build, optional)
    max_build_duration: 60
    # macOS, not linux_x2: Linux instances need a paid Codemagic plan and the
    # build dies instantly with "instance type is not available with the current
    # billing plan". This is why no Android release has ever built here.
    instance_type: mac_mini_m2
    environment:
      groups:
        # Create this group in Codemagic UI and add:
        # CM_KEYSTORE (base64-encoded philross.keystore), CM_KEYSTORE_PASSWORD,
        # CM_KEY_ALIAS, CM_KEY_PASSWORD, GOOGLE_PLAY_SERVICE_ACCOUNT_JSON (as file or var)
        - android_credentials
      node: 20.19.0
      java: 17
      vars:
        PACKAGE_NAME: "com.philross"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: |
          # Not --frozen-lockfile: yarn.lock is gitignored, so there is no
          # lockfile in the repo for it to freeze against.
          yarn install
      - name: Install the Android SDK pieces this project pins
        script: |
          # The build asks for compileSdk 35, build-tools 35.0.0 and NDK
          # 28.0.12674087 (android/build.gradle). The macOS image does not
          # ship that NDK, so Gradle went to fetch it mid-build through the
          # legacy SDK downloader and died there — surfacing as a stack trace
          # in LegacyDownloader.downloadAndStream, several layers from
          # anything that says "missing NDK".
          #
          # sdkmanager is not on PATH here (the first attempt at this step
          # exited 127), so it is located rather than called by name.
          SDKMANAGER=""
          for candidate in             "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"             "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"             "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -name sdkmanager -type f 2>/dev/null | head -1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            # Not fatal. Gradle can still fetch what it needs; this step is
            # here to make that fetch explicit, not to be the only way it can
            # happen. Failing here would hide whatever the build would say.
            echo "sdkmanager not found under ${ANDROID_SDK_ROOT:-$ANDROID_HOME} — leaving it to Gradle"
            exit 0
          fi

          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install             "platforms;android-35"             "build-tools;35.0.0"             "ndk;28.0.12674087"
      - name: Decode keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > android/app/philross.keystore
      - name: Build Android release bundle
        script: |
          cd android && chmod +x ./gradlew && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      # Uncomment once the Play Console service account JSON is wired in as a Codemagic integration
      # google_play:
      #   credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
      #   track: internal
      email:
        recipients:
          - info@byterisellc.com
        notify:
          success: true
          failure: true
