buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 26
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "28.0.12674087"  // Upgraded to r28 for 16KB page size support
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
        // maven { url "https://maven.revenuecat.com" }
        // maven { url 'https://mvn.superwall.com/release' }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")  // AGP 8.7.3 for 16KB page size compliance
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.0") // Google Services plugin
    }
}

allprojects {
    configurations.all {
        exclude group: 'com.android.support', module: 'support-compat'
        exclude group: 'com.android.support', module: 'support-annotations'
        exclude group: 'com.android.support', module: 'support-v4'
    }
}

apply plugin: "com.facebook.react.rootproject"
